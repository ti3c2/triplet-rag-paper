[project]
name = "trplet-rag"
version = "0.1.0"
description = "Triplet RAG"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.2",
    "asyncpg>=0.30.0",
    "datasets==3.6.0",
    "httpx>=0.28.1",
    "fire>=0.7.0",
    "huggingface-hub[hf-xet]>=0.33.1",
    "ir-datasets>=0.5.11",
    "openai>=1.93.0",
    "pandas>=2.3.0",
    "pyarrow>=20.0.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.1.1",
    "scikit-learn>=1.7.0",
    "sqlalchemy>=2.0.41",
    "tiktoken>=0.9.0",
    "tzdata>=2025.2",
    "transformers[tokenizers]>=4.53.3",
    "aiosqlite>=0.21.0",
    "gspread>=5.0.0",
    "google-auth>=2.0.0",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.5.1",
    "rapidfuzz>=3.14.0",
    "ragas>=0.3.2",
]

[project.scripts]
trcli = "src.cli:main"

[tool.setuptools]
packages = ["src"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.isort]
profile = "black"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.3",
    "seaborn>=0.13.2",
    "jupyter>=1.1.1",
    "ipython (>=8.0.0,<9.0.0)",
]
